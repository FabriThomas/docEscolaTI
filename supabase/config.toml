# ==============================================================================
# Steely Platform - Supabase Core Project Configuration (EDTS-378)
# Conforms to: ADR-08 (PostgreSQL 15+), ADR-09 (Data API Disabled), ADR-11 (50MiB)
# ==============================================================================

project_id = "steely-core"

[api]
# ADR-08 / ADR-09: Data API (PostgREST) disabled to prevent direct browser RPC/table bypass.
# All HTTP traffic routes through FastAPI; anon_key is used exclusively for Supabase Realtime.
enabled = false
port = 54321
schemas = []
extra_search_path = []
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# ADR-11: Supports dispute evidence videos up to 50 MB
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://steely.pages.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
