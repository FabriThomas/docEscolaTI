equipe: Steely
turma: B
artefatos:
  repositorio-1:
    link: https://github.com/FabriThomas/docEscolaTI
    descricao: |
      Documentação do Steely, plataforma web e mobile voltada à economia circular de
      hardware de TI (venda, leilão, doação para ONGs e descarte em ecopontos). O sistema
      combina identificação automática de peças por visão computacional (Scanner IA),
      gamificação com moedas virtuais, custódia segura de pagamento (Escrow de 7 dias),
      confirmação presencial via QR Code offline e métricas de impacto ambiental (ESG).
      O repositório está organizado em três pastas: 01-planejamento (TAP, requisitos,
      regras de negócio, especificações e diagramas de casos de uso, DER, classes, BPMN
      e catálogo das 59 telas do protótipo), 02-adrs (consolidação das 27 decisões de
      arquitetura em Markdown e PDF) e 03-sdlc-e-governanca (processo de desenvolvimento,
      organização das Sprints no Jira e roadmap do Scanner IA).
